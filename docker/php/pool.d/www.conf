[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 30
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 500

request_terminate_timeout = 120
catch_workers_output = yes
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
