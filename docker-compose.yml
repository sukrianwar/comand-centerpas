services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comand-center-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - comand-center-network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: comand-center-nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - comand-center-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: comand-center-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: comand_centerpas
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: comand_centerpas
      MYSQL_USER: comand_centerpas
      TZ: Asia/Jakarta
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - comand-center-network
    command: --default-authentication-plugin=mysql_native_password --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION" --default-time-zone='+07:00'

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comand-center-vite
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: npm run dev -- --host 0.0.0.0
    networks:
      - comand-center-network
    depends_on:
      - app

volumes:
  mysql-data:

networks:
  comand-center-network:
    driver: bridge
